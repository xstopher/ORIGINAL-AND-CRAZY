<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5cff" />
      <stop offset="50%" stop-color="#741cff" />
      <stop offset="100%" stop-color="#3c0b85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#741cff" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="#0c0a0f"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#ocGrad)" stroke-width="4" opacity="0.3"/>
  
  <!-- Stylized O & C letters -->
  <g filter="url(#glow)">
    <!-- O circle -->
    <circle cx="190" cy="256" r="110" fill="none" stroke="url(#ocGrad)" stroke-width="36"/>
    <!-- Inner accent -->
    <circle cx="190" cy="256" r="50" fill="#fbf9ff" opacity="0.9"/>
    
    <!-- Ampersand / slash accent -->
    <path d="M 235 150 L 275 362" stroke="#c6ff42" stroke-width="12" stroke-linecap="round"/>
    
    <!-- C arc -->
    <path d="M 390 170 A 110 110 0 1 0 390 342" fill="none" stroke="#fbf9ff" stroke-width="36" stroke-linecap="round"/>
  </g>
  
  <!-- Subtitle -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#c9a8ff" letter-spacing="6">ORIGINAL &amp; CRAZY</text>
</svg>
